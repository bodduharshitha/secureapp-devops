apiVersion: apps/v1
kind: Deployment

metadata:
  name: secureapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: secureapp

  template:
    metadata:
      labels:
        app: secureapp

    spec:
      containers:
        - name: secureapp
          image: secureapp:1.0.0

          ports:
            - containerPort: 5000

          imagePullPolicy: IfNotPresent
